name: CI (GitHub Actions trial)

# Mirrors .circleci/config.yml (minus the release/publish job) so this
# workflow can run in parallel with CircleCI for a trial period before we
# decide whether to switch CI platforms. Intentionally does NOT publish
# packages.

on:
    # No `pull_request` trigger: GitHub attaches check runs to the head
    # commit SHA regardless of which event triggered them, so `push` alone
    # already surfaces results on the PR "Checks" tab. Adding `pull_request`
    # on top of this would just run the whole pipeline twice per commit.
    push:
        branches:
            - '**'
    workflow_dispatch:

env:
    NODE_VERSION: '24.19.0'

jobs:
    install-build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            # Mirrors CircleCI's h5p-core-cache1/2: the H5P core/editor
            # download (scripts/install.sh) is pinned to fixed commit hashes,
            # so it only needs to be re-fetched when that script changes.
            - uses: actions/cache@v4
              with:
                  path: packages/h5p-examples/h5p
                  key: h5p-core-cache1-${{ hashFiles('scripts/install.sh') }}
            - uses: actions/cache@v4
              with:
                  path: packages/h5p-rest-example-server/h5p
                  key: h5p-core-cache2-${{ hashFiles('scripts/install.sh') }}
            - run: npm ci
            - run: npm run setup
            # Mirrors CircleCI's h5p-examples-cache: keyed on the content
            # type list generated by `npm run setup` above, so the (large,
            # occasionally flaky) H5P Hub content download is skipped
            # whenever that list hasn't changed since the last run.
            - uses: actions/cache@v4
              with:
                  path: test/data/hub-content
                  key: h5p-examples-cache-${{ hashFiles('test/data/content-type-cache/real-content-types.json') }}
            - run: |
                  npx concurrently \
                      "npm run build --prefix packages/h5p-rest-example-client" \
                      "npm run build --prefix packages/h5p-rest-example-server" \
                      "npm run download:content"
            # actions/upload-artifact zips the workspace and does not
            # preserve symlinks (it dereferences them into flat file
            # copies). node_modules/.bin/* entries are symlinks, and some
            # bin scripts (e.g. concurrently) do relative requires that only
            # resolve correctly from their real, nested location, so
            # flattening them breaks with MODULE_NOT_FOUND. tar preserves
            # symlinks and permissions natively, so archive first and let
            # upload-artifact ship a single opaque file.
            - name: Archive workspace
              run: |
                  tar -czf workspace.tar.gz \
                      node_modules \
                      packages/h5p-clamav-scanner/build \
                      packages/h5p-clamav-scanner/node_modules \
                      packages/h5p-examples/build \
                      packages/h5p-examples/h5p \
                      packages/h5p-examples/node_modules \
                      packages/h5p-express/build \
                      packages/h5p-express/node_modules \
                      packages/h5p-html-exporter/build \
                      packages/h5p-html-exporter/node_modules \
                      packages/h5p-mongos3/build \
                      packages/h5p-mongos3/node_modules \
                      packages/h5p-react/build \
                      packages/h5p-react/node_modules \
                      packages/h5p-redis-lock/build \
                      packages/h5p-redis-lock/node_modules \
                      packages/h5p-rest-example-client/build \
                      packages/h5p-rest-example-client/node_modules \
                      packages/h5p-rest-example-server/build \
                      packages/h5p-rest-example-server/h5p \
                      packages/h5p-rest-example-server/node_modules \
                      packages/h5p-server/build \
                      packages/h5p-server/node_modules \
                      packages/h5p-shared-state-server/build \
                      packages/h5p-shared-state-server/node_modules \
                      packages/h5p-svg-sanitizer/build \
                      packages/h5p-svg-sanitizer/node_modules \
                      packages/h5p-webcomponents/build \
                      packages/h5p-webcomponents/node_modules \
                      test/data/content-type-cache/real-content-types.json \
                      test/data/hub-content
            - uses: actions/upload-artifact@v4
              with:
                  name: workspace
                  retention-days: 1
                  # Already gzip-compressed by tar above; re-compressing the
                  # zip wrapper would just burn CPU for no size benefit.
                  compression-level: 0
                  path: workspace.tar.gz

    lint:
        needs: install-build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
            - uses: actions/download-artifact@v4
              with:
                  name: workspace
            - name: Extract workspace
              run: tar -xzf workspace.tar.gz
            - run: npm run lint

    format:
        needs: install-build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
            - uses: actions/download-artifact@v4
              with:
                  name: workspace
            - name: Extract workspace
              run: tar -xzf workspace.tar.gz
            - run: npm run format:check

    unit-tests:
        needs: install-build
        runs-on: ubuntu-latest
        env:
            NODE_ENV: development
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
            - uses: actions/download-artifact@v4
              with:
                  name: workspace
            - name: Extract workspace
              run: tar -xzf workspace.tar.gz
            - run: npx vitest run --config vitest.config.ts --coverage

    integration-tests:
        needs: install-build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
            - uses: actions/download-artifact@v4
              with:
                  name: workspace
            - name: Extract workspace
              run: tar -xzf workspace.tar.gz
            - run: npx vitest run --config vitest.integration.config.ts --coverage

    clamav-tests:
        needs: install-build
        runs-on: ubuntu-latest
        services:
            clamav:
                image: clamav/clamav:1.5.4
                ports:
                    - 3310:3310
        env:
            CLAMDSCAN_HOST: localhost
            CLAMDSCAN_PORT: 3310
            CLAMSCAN_DEBUG_MODE: true
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
            - uses: actions/download-artifact@v4
              with:
                  name: workspace
            - name: Extract workspace
              run: tar -xzf workspace.tar.gz
            - run: ./packages/h5p-clamav-scanner/test/wait_for_clamd.sh
            - run: npx vitest run --config packages/h5p-clamav-scanner/vitest.config.ts --coverage

    html-exporter-tests:
        needs: install-build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
            - uses: actions/download-artifact@v4
              with:
                  name: workspace
            - name: Extract workspace
              run: tar -xzf workspace.tar.gz
            - name: Locate Chrome
              run: echo "PUPPETEER_EXECUTABLE_PATH=$(which google-chrome || which google-chrome-stable || which chromium-browser)" >> "$GITHUB_ENV"
            - run: npx vitest run --config packages/h5p-html-exporter/vitest.config.ts --coverage

    db-tests:
        needs: install-build
        runs-on: ubuntu-latest
        services:
            mongo:
                image: mongo:8.0
                env:
                    MONGO_INITDB_ROOT_USERNAME: root
                    MONGO_INITDB_ROOT_PASSWORD: h5pnodejs
                ports:
                    - 27017:27017
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
            - uses: actions/download-artifact@v4
              with:
                  name: workspace
            - name: Extract workspace
              run: tar -xzf workspace.tar.gz
            - name: Start MinIO
              # GitHub Actions service containers can't override the image's
              # command, and MinIO needs "server /data" to start, so it's
              # launched manually here instead of via `services:`.
              run: |
                  docker run -d --name minio -p 9000:9000 -p 9001:9001 \
                      -e MINIO_ROOT_USER=minioaccesskey \
                      -e MINIO_ROOT_PASSWORD=miniosecret \
                      minio/minio:RELEASE.2025-09-07T16-13-09Z server /data --console-address :9001
                  timeout 30 sh -c 'until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done'
            - run: npm run test:h5p-mongos3 -- --coverage
